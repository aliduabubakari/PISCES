# Kestra Flow — Multi-Sensor IoT Analytics
# =========================================
# A moderately complex flow that processes IoT sensor data from
# multiple device groups in parallel, then aggregates results.
#
# Expected eco-design profile:
#   - LARGE_FAN_OUT (parallel device group processing)
#   - Heavy compute tasks (Spark job + Python analytics)
#   - Frequent schedule (every 15 minutes)

id: iot_sensor_analytics
namespace: data.iot
description: "IoT sensor data processing with parallel device groups and Spark analytics"
labels:
  app: pisces-samples
  type: analytics

inputs:
  - name: device_groups
    type: ARRAY
    defaults:
      - group_a
      - group_b
      - group_c
      - group_d

tasks:
  # --- Ingest raw sensor data ---
  - id: ingest_sensors
    type: io.kestra.plugin.scripts.python.Script
    description: "Fetch raw sensor readings from all device groups"
    script: |
      import json
      import random
      from datetime import datetime

      device_groups = {{ inputs.device_groups }}
      all_readings = {}

      for group in device_groups:
          readings = []
          for device_id in range(1, 6):
              readings.append({
                  "device_id": f"{group}_d{device_id:03d}",
                  "temperature": round(random.uniform(18.0, 30.0), 2),
                  "humidity": round(random.uniform(30.0, 80.0), 2),
                  "co2_ppm": random.randint(400, 1200),
                  "battery_pct": random.randint(10, 100),
                  "timestamp": datetime.now().isoformat(),
              })
          all_readings[group] = readings

      print(json.dumps(all_readings))

  # --- Parallel: Process each device group ---
  # Group A
  - id: process_group_a
    type: io.kestra.plugin.scripts.python.Script
    description: "Process sensor data for Group A"
    inputs:
      readings: "{{ outputs.ingest_sensors.vars }}"
    script: |
      import json
      data = json.loads("{{ inputs.readings }}")
      group = data.get("group_a", [])
      result = {"group": "A", "count": len(group), "avg_temp": 0.0}
      if group:
          temps = [r["temperature"] for r in group]
          result["avg_temp"] = round(sum(temps)/len(temps), 2)
          result["max_co2"] = max(r["co2_ppm"] for r in group)
      print(json.dumps(result))
    retry:
      maxAttempt: 2

  # Group B
  - id: process_group_b
    type: io.kestra.plugin.scripts.python.Script
    description: "Process sensor data for Group B"
    inputs:
      readings: "{{ outputs.ingest_sensors.vars }}"
    script: |
      import json
      data = json.loads("{{ inputs.readings }}")
      group = data.get("group_b", [])
      result = {"group": "B", "count": len(group), "avg_temp": 0.0}
      if group:
          temps = [r["temperature"] for r in group]
          result["avg_temp"] = round(sum(temps)/len(temps), 2)
          result["max_co2"] = max(r["co2_ppm"] for r in group)
      print(json.dumps(result))
    retry:
      maxAttempt: 2

  # Group C
  - id: process_group_c
    type: io.kestra.plugin.scripts.python.Script
    description: "Process sensor data for Group C"
    inputs:
      readings: "{{ outputs.ingest_sensors.vars }}"
    script: |
      import json
      data = json.loads("{{ inputs.readings }}")
      group = data.get("group_c", [])
      result = {"group": "C", "count": len(group), "avg_temp": 0.0}
      if group:
          temps = [r["temperature"] for r in group]
          result["avg_temp"] = round(sum(temps)/len(temps), 2)
          result["max_co2"] = max(r["co2_ppm"] for r in group)
      print(json.dumps(result))
    retry:
      maxAttempt: 2

  # Group D
  - id: process_group_d
    type: io.kestra.plugin.scripts.python.Script
    description: "Process sensor data for Group D"
    inputs:
      readings: "{{ outputs.ingest_sensors.vars }}"
    script: |
      import json
      data = json.loads("{{ inputs.readings }}")
      group = data.get("group_d", [])
      result = {"group": "D", "count": len(group), "avg_temp": 0.0}
      if group:
          temps = [r["temperature"] for r in group]
          result["avg_temp"] = round(sum(temps)/len(temps), 2)
          result["max_co2"] = max(r["co2_ppm"] for r in group)
      print(json.dumps(result))
    retry:
      maxAttempt: 2

  # --- Spark Analytics (HEAVY COMPUTE) ---
  - id: spark_analytics
    type: io.kestra.plugin.scripts.python.Script
    description: "Run Spark job for cross-group analytics (simulated)"
    inputs:
      results_json: |
        {
          "group_a": "{{ outputs.process_group_a.vars }}",
          "group_b": "{{ outputs.process_group_b.vars }}",
          "group_c": "{{ outputs.process_group_c.vars }}",
          "group_d": "{{ outputs.process_group_d.vars }}"
        }
    script: |
      import json
      # Simulate a heavy Spark/analytics job
      results = json.loads("""{{ inputs.results_json }}""")
      groups = {}
      for key, val_str in results.items():
          if val_str:
              groups[key] = json.loads(val_str)

      all_temps = []
      all_co2 = []
      for gdata in groups.values():
          all_temps.append(gdata.get("avg_temp", 0))
          all_co2.append(gdata.get("max_co2", 0))

      analytics = {
          "total_groups": len(groups),
          "overall_avg_temp": round(sum(all_temps)/max(len(all_temps),1), 2),
          "peak_co2_ppm": max(all_co2) if all_co2 else 0,
          "status": "healthy" if max(all_co2) < 1000 else "needs_attention",
      }
      print(json.dumps(analytics))
    retry:
      maxAttempt: 1

  # --- Generate Report ---
  - id: generate_report
    type: io.kestra.plugin.scripts.python.Script
    description: "Generate final analytics report"
    inputs:
      analytics_json: "{{ outputs.spark_analytics.vars }}"
    script: |
      import json
      from datetime import datetime

      analytics = json.loads("{{ inputs.analytics_json }}")

      report = {
          "report_type": "iot_sensor_daily",
          "generated_at": datetime.now().isoformat(),
          "analytics": analytics,
          "summary": (
              f"Processed {analytics['total_groups']} device groups. "
              f"Overall health: {analytics['status']}. "
              f"Avg temp: {analytics['overall_avg_temp']}°C, "
              f"Peak CO2: {analytics['peak_co2_ppm']} ppm"
          ),
      }

      print(json.dumps(report, indent=2))

triggers:
  - id: frequent_schedule
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"  # Every 15 minutes
